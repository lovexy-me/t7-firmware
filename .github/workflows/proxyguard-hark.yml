name: proxyguard-hark
on:
  push:
    branches: [proxyguard-hark]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Test and build
        run: |
          go vet ./...
          go test ./...
          for a in amd64 arm64; do
            for b in client server; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -ldflags "-s -w" -o out/proxyguard-$b-linux-$a ./cmd/proxyguard-$b
            done
          done
          cd out && for f in proxyguard-*; do xz -9e -k $f; done && sha256sum proxyguard-* > SHA256SUMS && ls -la
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=proxyguard-hark-${{ github.run_id }}
          gh release create $T out/*.xz out/SHA256SUMS -R ${{ github.repository }} --target ${{ github.sha }} --prerelease -t "$T" -n "ProxyGuard 2.1.1 + UDP SO_RCVBUF 4MB (client). Upstream: codeberg.org/eduVPN/proxyguard"
