name: build-t7
on:
  workflow_dispatch:
  push:
    paths: [seed.config, .github/workflows/build.yml, diy.sh]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h /
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget swig libelf-dev ccache xsltproc
      - name: Source
        run: |
          git clone --depth 1 -b openwrt-21.02 https://github.com/hanwckf/immortalwrt-mt798x.git src
          cd src && git log -1 --format='%h %cd'
      - name: Feeds
        run: bash diy.sh
      - name: Config
        run: |
          cd src && cp ../seed.config .config && make defconfig
          echo "== missing from final config =="
          grep '=y' ../seed.config | cut -d= -f1 | while read k; do grep -q "^$k=y" .config || echo "MISSING $k"; done
          grep '=n' ../seed.config | cut -d= -f1 | while read k; do grep -q "^$k=y" .config && echo "STILL_ON $k"; done; true
      - name: Download
        run: cd src && make download -j8 || make download -j1 V=s
      - name: Build
        run: cd src && (make -j$(nproc) || make -j1 V=s)
      - name: Sizes
        if: always()
        run: |
          cd src/bin/targets/*/* 2>/dev/null && ls -la && cat *.manifest | sort > manifest.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t7-firmware
          path: |
            src/bin/targets/*/*/*sysupgrade*
            src/bin/targets/*/*/*.manifest
            src/bin/targets/*/*/sha256sums
            src/bin/targets/*/*/config.buildinfo
            src/.config
